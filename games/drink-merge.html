<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Drink Merge</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:linear-gradient(170deg,#0a0f1e,#0f2027,#1a3a4a);
      display:flex;flex-direction:column;align-items:center;
      padding:10px 0 16px;font-family:system-ui,sans-serif;
      user-select:none;-webkit-user-select:none;min-height:100vh;
      color:#e8eaf0;overflow-x:hidden}
    #hud{display:flex;gap:6px;margin-bottom:8px;width:100%;padding:0 12px}
    .hud-box{flex:1;background:#0c1526;border-radius:10px;padding:6px 4px;
      text-align:center;border:1px solid #1e3a5f}
    .hud-label{color:#3a5570;font-size:9px;letter-spacing:1px;text-transform:uppercase}
    .hud-val{font-size:18px;font-weight:800;line-height:1.2}
    #shooter-row{display:flex;margin-bottom:3px}
    .shooter-cell{display:flex;align-items:center;justify-content:center;
      cursor:pointer;transition:opacity 0.1s, filter 0.1s}
    #board-wrap{position:relative;flex-shrink:0}
    #board{display:grid;
      background:linear-gradient(180deg,#060d1a,#0d1b2a);
      border:1.5px solid #1a3050;border-radius:12px;overflow:hidden;
      box-shadow:0 4px 40px rgba(0,0,0,.6)}
    .cell{display:flex;align-items:center;justify-content:center;
      border-right:1px solid rgba(255,255,255,0.04);
      border-bottom:1px solid rgba(255,255,255,0.04)}
    .cell.danger-top{border-top:1px solid rgba(239,68,68,0.25)}
    .cell.hot{background:rgba(255,160,32,0.09)}
    .tap-zone{position:absolute;top:0;cursor:pointer;z-index:10}
    #progress-wrap{margin-top:8px;padding:0 12px;width:100%}
    #progress-bar-bg{height:3px;background:#0d1b2a;border-radius:99px;overflow:hidden;margin-top:3px}
    #progress-bar{height:100%;background:linear-gradient(90deg,#34d399,#059669);
      border-radius:99px;transition:width 0.3s;width:0%}
    #progress-label{display:flex;justify-content:space-between;color:#2a4060;font-size:10px}
    #hint{color:#1e3a50;font-size:10px;text-align:center;margin-top:5px}
    #combo{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);
      font-size:32px;font-weight:900;color:#fcd34d;
      text-shadow:0 0 24px #f59e0b;z-index:999;
      pointer-events:none;display:none}
    #gameover{position:absolute;inset:0;background:rgba(0,0,0,.92);
      display:none;flex-direction:column;align-items:center;justify-content:center;
      gap:8px;z-index:50;border-radius:12px}
    #replay-btn{margin-top:8px;background:linear-gradient(135deg,#fcd34d,#f59e0b);
      color:#0a0f1e;border:none;border-radius:10px;padding:11px 36px;
      font-size:15px;font-weight:800;cursor:pointer}
    #anim{position:absolute;pointer-events:none;z-index:20;
      display:none;align-items:center;justify-content:center}
    @keyframes pop{
      0%{transform:translate(-50%,-50%) scale(.3);opacity:0}
      65%{transform:translate(-50%,-50%) scale(1.2);opacity:1}
      100%{transform:translate(-50%,-50%) scale(1);opacity:1}
    }
  </style>
</head>
<body>

<div id="hud">
  <div class="hud-box">
    <div class="hud-label">Score</div>
    <div class="hud-val" id="score" style="color:#fcd34d">0</div>
  </div>
  <div class="hud-box">
    <div class="hud-label">Level</div>
    <div class="hud-val" id="level" style="color:#34d399">1</div>
  </div>
  <div class="hud-box">
    <div class="hud-label">Next</div>
    <div class="hud-val" id="next-drink">🍊</div>
  </div>
</div>

<div id="combo"></div>
<div id="shooter-row"></div>

<div id="board-wrap">
  <div id="board"></div>
  <div id="anim"></div>
  <div id="gameover">
    <div style="font-size:44px">😵</div>
    <div style="color:#f87171;font-size:22px;font-weight:900">GAME OVER</div>
    <div id="gameover-level" style="color:#64748b;font-size:12px"></div>
    <div id="gameover-score" style="color:#fcd34d;font-size:28px;font-weight:800"></div>
    <button id="replay-btn">Play Again</button>
  </div>
</div>

<div id="progress-wrap">
  <div id="progress-label">
    <span id="plevel">Level 1</span>
    <span id="pdrops">0/15 to next level</span>
  </div>
  <div id="progress-bar-bg"><div id="progress-bar"></div></div>
  <div id="hint">Tap any column to drop · Match 3 to clear</div>
</div>

<script>
const TYPES=[
  {emoji:"🧃",color:"#f59e0b"},
  {emoji:"🍊",color:"#f97316"},
  {emoji:"🍹",color:"#10b981"},
  {emoji:"🫐",color:"#8b5cf6"},
  {emoji:"🍸",color:"#3b82f6"},
  {emoji:"🥂",color:"#fcd34d"},
  {emoji:"🍷",color:"#dc2626"},
];
const COLS=6,ROWS=10;
let board,current,next,score,drops,level,over,busy;
let cellSize,BW,BH;

function calcSize(){
  // fit everything on screen with no scroll
  const availH=window.innerHeight - 10 - 16 - 46 - 38 - 52 - 10; // hud+shooter+progress
  const byW=Math.floor((window.innerWidth-24)/COLS);
  const byH=Math.floor(availH/ROWS);
  cellSize=Math.min(byW,byH,54);
  BW=cellSize*COLS;
  BH=cellSize*ROWS;
}

function randType(max){return Math.floor(Math.random()*(Math.min(max,6)+1));}
function emptyBoard(){return Array.from({length:ROWS},()=>Array(COLS).fill(null));}
function cloneBoard(b){return b.map(r=>r.map(c=>c!==null?c:null));}

function applyGravity(b){
  for(let c=0;c<COLS;c++){
    const stack=[];
    for(let r=0;r<ROWS;r++) if(b[r][c]!==null) stack.push(b[r][c]);
    for(let r=0;r<ROWS;r++) b[r][c]=null;
    stack.forEach((item,i)=>{b[ROWS-stack.length+i][c]=item;});
  }
}

function findMatches(b){
  const hit=new Set();
  for(let r=0;r<ROWS;r++)
    for(let c=0;c<=COLS-3;c++){
      const a=b[r][c];
      if(a!==null&&a===b[r][c+1]&&a===b[r][c+2]){
        hit.add(`${r},${c}`);hit.add(`${r},${c+1}`);hit.add(`${r},${c+2}`);
      }
    }
  for(let c=0;c<COLS;c++)
    for(let r=0;r<=ROWS-3;r++){
      const a=b[r][c];
      if(a!==null&&a===b[r+1][c]&&a===b[r+2][c]){
        hit.add(`${r},${c}`);hit.add(`${r+1},${c}`);hit.add(`${r+2},${c}`);
      }
    }
  return hit;
}

function resolveBoard(b){
  let cleared=0;
  while(true){
    const m=findMatches(b);
    if(!m.size) break;
    cleared+=m.size;
    m.forEach(k=>{const[r,c]=k.split(',').map(Number);b[r][c]=null;});
    applyGravity(b);
  }
  return cleared;
}

function makeInitialBoard(){
  const b=emptyBoard();
  for(let r=ROWS-3;r<ROWS;r++)
    for(let c=0;c<COLS;c++)
      b[r][c]=randType(2);
  resolveBoard(b);
  return b;
}

function initGame(){
  board=makeInitialBoard();
  current=randType(2);
  next=randType(2);
  score=0;drops=0;level=1;over=false;busy=false;
}

function buildDOM(){
  calcSize();

  // shooter row
  const sr=document.getElementById('shooter-row');
  sr.innerHTML='';
  sr.style.width=BW+'px';
  for(let c=0;c<COLS;c++){
    const d=document.createElement('div');
    d.className='shooter-cell';
    d.style.cssText=`width:${cellSize}px;height:${cellSize}px;font-size:${cellSize*0.52}px`;
    d.id='sc'+c;
    sr.appendChild(d);
  }

  // board cells
  const boardEl=document.getElementById('board');
  boardEl.style.cssText=`width:${BW}px;height:${BH}px;grid-template-columns:repeat(${COLS},${cellSize}px);grid-template-rows:repeat(${ROWS},${cellSize}px)`;
  boardEl.innerHTML='';
  for(let r=0;r<ROWS;r++)
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div');
      d.className='cell'+(r===1?' danger-top':'');
      d.style.fontSize=(cellSize*0.5)+'px';
      d.id=`cl${r}_${c}`;
      boardEl.appendChild(d);
    }

  // tap zones
  const wrap=document.getElementById('board-wrap');
  wrap.style.width=BW+'px';
  document.querySelectorAll('.tap-zone').forEach(e=>e.remove());
  for(let c=0;c<COLS;c++){
    const d=document.createElement('div');
    d.className='tap-zone';
    d.style.cssText=`left:${c*cellSize}px;width:${cellSize}px;height:${BH}px`;
    d.addEventListener('pointerdown',e=>{e.preventDefault();drop(c);});
    wrap.appendChild(d);
  }

  // anim
  const anim=document.getElementById('anim');
  anim.style.cssText=`width:${cellSize}px;height:${cellSize}px;font-size:${cellSize*0.5}px;left:0;top:0`;

  // progress
  document.getElementById('progress-wrap').style.width=BW+'px';
  document.getElementById('hud').style.width=BW+'px';
}

function renderBoard(activeCol){
  for(let r=0;r<ROWS;r++)
    for(let c=0;c<COLS;c++){
      const el=document.getElementById(`cl${r}_${c}`);
      const val=board[r][c];
      el.textContent=val!==null?TYPES[val].emoji:'';
      el.classList.toggle('hot',c===activeCol);
    }
}

function renderHUD(){
  document.getElementById('score').textContent=score;
  document.getElementById('level').textContent=level;
  document.getElementById('next-drink').textContent=TYPES[next].emoji;
  const rem=15-(drops%15);
  document.getElementById('plevel').textContent='Level '+level;
  document.getElementById('pdrops').textContent=(drops%15)+'/15 to next level';
  document.getElementById('progress-bar').style.width=((drops%15)/15*100)+'%';
}

function renderShooter(activeCol){
  const t=TYPES[current];
  for(let c=0;c<COLS;c++){
    const el=document.getElementById('sc'+c);
    el.textContent=t.emoji;
    const isActive=c===activeCol;
    el.style.opacity=isActive?'1':'0.25';
    el.style.filter=isActive?`drop-shadow(0 0 6px ${t.color})`:'none';
  }
}

function showCombo(msg){
  const el=document.getElementById('combo');
  el.textContent=msg;
  el.style.display='block';
  el.style.animation='none';
  void el.offsetWidth;
  el.style.animation='pop .35s cubic-bezier(.36,2,.6,1) both';
  setTimeout(()=>{el.style.display='none';},1200);
}

function drop(col){
  if(over||busy) return;
  if(board[0][col]!==null) return;
  busy=true;

  const droppedType=current;
  renderShooter(col);
  renderBoard(col);

  // animate
  const anim=document.getElementById('anim');
  anim.textContent=TYPES[droppedType].emoji;
  anim.style.left=(col*cellSize)+'px';
  anim.style.top='0px';
  anim.style.display='flex';

  // manual animation via requestAnimationFrame
  const duration=200;
  const start=performance.now();
  function animate(now){
    const t=Math.min((now-start)/duration,1);
    const ease=t*t; // ease-in
    anim.style.top=(ease*BH)+'px';
    anim.style.opacity=String(1-t*0.8);
    if(t<1){requestAnimationFrame(animate);}
    else{
      anim.style.display='none';
      finalizeDrop(col,droppedType);
    }
  }
  requestAnimationFrame(animate);
}

function finalizeDrop(col,droppedType){
  let row=-1;
  for(let r=ROWS-1;r>=0;r--){
    if(board[r][col]===null){row=r;break;}
  }
  if(row===-1){busy=false;return;}

  board[row][col]=droppedType;
  const cleared=resolveBoard(board);

  drops++;
  level=Math.min(Math.floor(drops/15)+1,7);
  score+=cleared*10*level;
  current=next;
  next=randType(Math.min(level+1,6));
  over=board[0].some(c=>c!==null);

  if(cleared>0){
    showCombo(cleared>=9?"🔥 INSANE!":cleared>=6?"💥 MEGA!":"✨ NICE!");
  }

  renderBoard(null);
  renderHUD();
  renderShooter(null);

  if(over){
    document.getElementById('gameover-level').textContent='Level '+level;
    document.getElementById('gameover-score').textContent=score+' pts';
    document.getElementById('gameover').style.display='flex';
  }
  busy=false;
}

function startGame(){
  initGame();
  buildDOM();
  renderBoard(null);
  renderHUD();
  renderShooter(null);
  document.getElementById('gameover').style.display='none';
}

document.getElementById('replay-btn').addEventListener('click',startGame);
window.addEventListener('resize',()=>{buildDOM();renderBoard(null);renderHUD();renderShooter(null);});
startGame();
</script>
</body>
</html>
