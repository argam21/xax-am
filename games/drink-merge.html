<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Drink Merge</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      background:linear-gradient(170deg,#0a0f1e,#0f2027,#1a3a4a);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:12px;font-family:system-ui,sans-serif;
      user-select:none;-webkit-user-select:none;
      min-height:100vh;color:#e8eaf0;overflow:hidden;
    }
    #game-wrap{
      display:flex;flex-direction:column;align-items:center;
      width:100%;max-width:400px;
    }

    /* HUD */
    #hud{display:flex;gap:8px;margin-bottom:10px;width:100%}
    .hud-box{
      flex:1;background:#0c1526;border-radius:10px;
      padding:8px 6px;text-align:center;border:1px solid #1e3a5f;
    }
    .hud-label{color:#6a85a0;font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
    .hud-val{font-size:20px;font-weight:800;line-height:1.1}

    /* SHOOTER — single prominent drink with column arrows */
    #shooter-wrap{
      position:relative;width:100%;margin-bottom:4px;
    }
    #shooter-row{display:flex;width:100%}
    .shooter-cell{
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;position:relative;transition:background 0.1s;
      border-radius:8px;
    }
    .shooter-cell .arrow{
      position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
      font-size:10px;color:#e8a020;opacity:0;transition:opacity 0.15s;
    }
    .shooter-cell.active{background:rgba(232,160,32,0.12)}
    .shooter-cell.active .arrow{opacity:1}
    .shooter-cell .drink-icon{
      font-size:26px;opacity:0.5;transition:opacity 0.15s, transform 0.15s, filter 0.15s;
    }
    .shooter-cell.active .drink-icon{
      opacity:1;transform:scale(1.15);
      filter:drop-shadow(0 0 8px var(--drink-color,#f59e0b));
    }

    /* BOARD */
    #board-wrap{position:relative;width:100%}
    #board{
      display:grid;width:100%;
      background:linear-gradient(180deg,#060d1a,#0d1b2a);
      border:1.5px solid #1a3050;border-radius:12px;overflow:hidden;
      box-shadow:0 4px 40px rgba(0,0,0,.6);
    }
    .cell{
      display:flex;align-items:center;justify-content:center;
      border-right:1px solid rgba(255,255,255,0.04);
      border-bottom:1px solid rgba(255,255,255,0.04);
      transition:background 0.1s;
    }
    .cell.danger-top{border-top:1px solid rgba(239,68,68,0.3)}
    .cell.hot{background:rgba(232,160,32,0.08)}
    .tap-zone{position:absolute;top:0;cursor:pointer;z-index:10}

    /* ANIM */
    #anim{
      position:absolute;pointer-events:none;z-index:20;
      display:none;align-items:center;justify-content:center;
    }

    /* PROGRESS */
    #progress-wrap{margin-top:10px;width:100%}
    #progress-label{
      display:flex;justify-content:space-between;
      color:#8a9ab0;font-size:12px;font-weight:500;margin-bottom:5px;
    }
    #progress-bar-bg{height:4px;background:#0d1b2a;border-radius:99px;overflow:hidden}
    #progress-bar{height:100%;background:linear-gradient(90deg,#34d399,#059669);border-radius:99px;transition:width 0.3s;width:0%}
    #hint{color:#4a6070;font-size:11px;text-align:center;margin-top:6px}

    /* COMBO */
    #combo{
      position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);
      font-size:36px;font-weight:900;color:#fcd34d;
      text-shadow:0 0 24px #f59e0b;z-index:999;
      pointer-events:none;display:none;
    }

    /* GAMEOVER */
    #gameover{
      position:absolute;inset:0;background:rgba(0,0,0,.92);
      display:none;flex-direction:column;align-items:center;justify-content:center;
      gap:10px;z-index:50;border-radius:12px;
    }
    #replay-btn{
      margin-top:8px;background:linear-gradient(135deg,#fcd34d,#f59e0b);
      color:#0a0f1e;border:none;border-radius:10px;
      padding:12px 40px;font-size:15px;font-weight:800;cursor:pointer;
    }

    @keyframes pop{
      0%{transform:translate(-50%,-50%) scale(.3);opacity:0}
      65%{transform:translate(-50%,-50%) scale(1.2);opacity:1}
      100%{transform:translate(-50%,-50%) scale(1);opacity:1}
    }
  </style>
</head>
<body>
<div id="game-wrap">

  <div id="hud">
    <div class="hud-box"><div class="hud-label">Score</div><div class="hud-val" id="score" style="color:#fcd34d">0</div></div>
    <div class="hud-box"><div class="hud-label">Level</div><div class="hud-val" id="level" style="color:#34d399">1</div></div>
    <div class="hud-box"><div class="hud-label">Next</div><div class="hud-val" id="next-drink">🍊</div></div>
  </div>

  <div id="combo"></div>

  <div id="shooter-wrap">
    <div id="shooter-row"></div>
  </div>

  <div id="board-wrap">
    <div id="board"></div>
    <div id="anim"></div>
    <div id="gameover">
      <div style="font-size:48px">😵</div>
      <div style="color:#f87171;font-size:24px;font-weight:900">GAME OVER</div>
      <div id="gameover-level" style="color:#64748b;font-size:13px"></div>
      <div id="gameover-score" style="color:#fcd34d;font-size:30px;font-weight:800"></div>
      <button id="replay-btn">Play Again</button>
    </div>
  </div>

  <div id="progress-wrap">
    <div id="progress-label">
      <span id="plevel">Level 1</span>
      <span id="pdrops">0 / 15 to next level</span>
    </div>
    <div id="progress-bar-bg"><div id="progress-bar"></div></div>
    <div id="hint">Tap a column to drop · Match 3 to clear</div>
  </div>

</div>

<script>
const TYPES=[
  {emoji:"🧃",color:"#f59e0b"},
  {emoji:"🍊",color:"#f97316"},
  {emoji:"🍹",color:"#10b981"},
  {emoji:"🫐",color:"#8b5cf6"},
  {emoji:"🍸",color:"#3b82f6"},
  {emoji:"🥂",color:"#fcd34d"},
  {emoji:"🍷",color:"#dc2626"},
];
const COLS=6,ROWS=10;
let board,current,next,score,drops,level,over,busy,activeCol;
let cellSize,BW,BH;

function calcSize(){
  const maxW=Math.min(window.innerWidth-24,400);
  const hudH=58+14; // hud+margin
  const shooterH=44;
  const progressH=58;
  const padding=24;
  const availH=window.innerHeight-hudH-shooterH-progressH-padding;
  const byW=Math.floor(maxW/COLS);
  const byH=Math.floor(availH/ROWS);
  cellSize=Math.max(Math.min(byW,byH,54),32);
  BW=cellSize*COLS;
  BH=cellSize*ROWS;
}

function randType(max){return Math.floor(Math.random()*(Math.min(max,6)+1));}
function emptyBoard(){return Array.from({length:ROWS},()=>Array(COLS).fill(null));}

function applyGravity(b){
  for(let c=0;c<COLS;c++){
    const stack=[];
    for(let r=0;r<ROWS;r++) if(b[r][c]!==null) stack.push(b[r][c]);
    for(let r=0;r<ROWS;r++) b[r][c]=null;
    stack.forEach((item,i)=>{b[ROWS-stack.length+i][c]=item;});
  }
}

function findMatches(b){
  const hit=new Set();
  for(let r=0;r<ROWS;r++)
    for(let c=0;c<=COLS-3;c++){
      const a=b[r][c];
      if(a!==null&&a===b[r][c+1]&&a===b[r][c+2]){
        hit.add(`${r},${c}`);hit.add(`${r},${c+1}`);hit.add(`${r},${c+2}`);
      }
    }
  for(let c=0;c<COLS;c++)
    for(let r=0;r<=ROWS-3;r++){
      const a=b[r][c];
      if(a!==null&&a===b[r+1][c]&&a===b[r+2][c]){
        hit.add(`${r},${c}`);hit.add(`${r+1},${c}`);hit.add(`${r+2},${c}`);
      }
    }
  return hit;
}

function resolveBoard(b){
  let cleared=0;
  while(true){
    const m=findMatches(b);
    if(!m.size) break;
    cleared+=m.size;
    m.forEach(k=>{const[r,c]=k.split(',').map(Number);b[r][c]=null;});
    applyGravity(b);
  }
  return cleared;
}

function makeInitialBoard(){
  const b=emptyBoard();
  for(let r=ROWS-3;r<ROWS;r++)
    for(let c=0;c<COLS;c++)
      b[r][c]=randType(2);
  resolveBoard(b);
  return b;
}

function initGame(){
  board=makeInitialBoard();
  current=randType(2);
  next=randType(2);
  score=0;drops=0;level=1;over=false;busy=false;activeCol=null;
}

function buildDOM(){
  calcSize();
  const t=TYPES[current];

  // shooter row
  const sr=document.getElementById('shooter-row');
  sr.innerHTML='';
  sr.style.width=BW+'px';
  for(let c=0;c<COLS;c++){
    const d=document.createElement('div');
    d.className='shooter-cell';
    d.style.cssText=`width:${cellSize}px;height:${cellSize*0.8}px;--drink-color:${t.color}`;
    d.id='sc'+c;
    const icon=document.createElement('span');
    icon.className='drink-icon';
    icon.textContent=t.emoji;
    const arrow=document.createElement('span');
    arrow.className='arrow';
    arrow.textContent='▼';
    d.appendChild(icon);
    d.appendChild(arrow);
    d.addEventListener('pointerdown',e=>{e.preventDefault();drop(c);});
    sr.appendChild(d);
  }

  // board
  const boardEl=document.getElementById('board');
  boardEl.style.cssText=`width:${BW}px;height:${BH}px;grid-template-columns:repeat(${COLS},${cellSize}px);grid-template-rows:repeat(${ROWS},${cellSize}px)`;
  boardEl.innerHTML='';
  for(let r=0;r<ROWS;r++)
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div');
      d.className='cell'+(r===1?' danger-top':'');
      d.style.fontSize=(cellSize*0.5)+'px';
      d.id=`cl${r}_${c}`;
      boardEl.appendChild(d);
    }

  // tap zones
  const wrap=document.getElementById('board-wrap');
  wrap.style.width=BW+'px';
  document.querySelectorAll('.tap-zone').forEach(e=>e.remove());
  for(let c=0;c<COLS;c++){
    const d=document.createElement('div');
    d.className='tap-zone';
    d.style.cssText=`left:${c*cellSize}px;width:${cellSize}px;height:${BH}px`;
    d.addEventListener('pointerdown',e=>{e.preventDefault();drop(c);});
    wrap.appendChild(d);
  }

  // anim
  const anim=document.getElementById('anim');
  anim.style.cssText=`width:${cellSize}px;height:${cellSize}px;font-size:${cellSize*0.5}px`;

  document.getElementById('progress-wrap').style.width=BW+'px';
  document.getElementById('hud').style.width=BW+'px';
}

function renderBoard(ac){
  activeCol=ac;
  for(let r=0;r<ROWS;r++)
    for(let c=0;c<COLS;c++){
      const el=document.getElementById(`cl${r}_${c}`);
      const val=board[r][c];
      el.textContent=val!==null?TYPES[val].emoji:'';
      el.classList.toggle('hot',c===ac);
    }
}

function renderShooter(ac){
  const t=TYPES[current];
  for(let c=0;c<COLS;c++){
    const el=document.getElementById('sc'+c);
    const icon=el.querySelector('.drink-icon');
    icon.textContent=t.emoji;
    el.style.setProperty('--drink-color',t.color);
    el.classList.toggle('active',c===ac);
  }
}

function renderHUD(){
  document.getElementById('score').textContent=score;
  document.getElementById('level').textContent=level;
  document.getElementById('next-drink').textContent=TYPES[next].emoji;
  document.getElementById('plevel').textContent='Level '+level;
  document.getElementById('pdrops').textContent=(drops%15)+' / 15 to next level';
  document.getElementById('progress-bar').style.width=((drops%15)/15*100)+'%';
}

function showCombo(msg){
  const el=document.getElementById('combo');
  el.textContent=msg;
  el.style.display='block';
  el.style.animation='none';
  void el.offsetWidth;
  el.style.animation='pop .4s cubic-bezier(.36,2,.6,1) both';
  setTimeout(()=>{el.style.display='none';},1300);
}

function drop(col){
  if(over||busy) return;
  if(board[0][col]!==null) return;
  busy=true;

  const droppedType=current;
  renderShooter(col);
  renderBoard(col);

  const anim=document.getElementById('anim');
  anim.textContent=TYPES[droppedType].emoji;
  anim.style.left=(col*cellSize)+'px';
  anim.style.top='0px';
  anim.style.opacity='1';
  anim.style.display='flex';

  const duration=180;
  const start=performance.now();
  function animate(now){
    const t=Math.min((now-start)/duration,1);
    const ease=t*t;
    anim.style.top=(ease*BH)+'px';
    anim.style.opacity=String(1-t*0.7);
    if(t<1){requestAnimationFrame(animate);}
    else{
      anim.style.display='none';
      finalizeDrop(col,droppedType);
    }
  }
  requestAnimationFrame(animate);
}

function finalizeDrop(col,droppedType){
  let row=-1;
  for(let r=ROWS-1;r>=0;r--){
    if(board[r][col]===null){row=r;break;}
  }
  if(row===-1){busy=false;return;}

  board[row][col]=droppedType;
  const cleared=resolveBoard(board);

  drops++;
  level=Math.min(Math.floor(drops/15)+1,7);
  score+=cleared*10*level;
  current=next;
  next=randType(Math.min(level+1,6));
  over=board[0].some(c=>c!==null);

  if(cleared>0) showCombo(cleared>=9?"🔥 INSANE!":cleared>=6?"💥 MEGA!":"✨ NICE!");

  // rebuild shooter with new current drink
  renderShooterIcons();
  renderBoard(null);
  renderHUD();
  renderShooter(null);

  if(over){
    document.getElementById('gameover-level').textContent='Level '+level;
    document.getElementById('gameover-score').textContent=score+' pts';
    document.getElementById('gameover').style.display='flex';
  }
  busy=false;
}

function renderShooterIcons(){
  // update emoji in shooter cells when current changes
  const t=TYPES[current];
  for(let c=0;c<COLS;c++){
    const el=document.getElementById('sc'+c);
    if(el){
      el.querySelector('.drink-icon').textContent=t.emoji;
      el.style.setProperty('--drink-color',t.color);
    }
  }
}

function startGame(){
  initGame();
  buildDOM();
  renderBoard(null);
  renderHUD();
  renderShooter(null);
  document.getElementById('gameover').style.display='none';
}

document.getElementById('replay-btn').addEventListener('click',startGame);
window.addEventListener('resize',()=>{
  buildDOM();
  renderBoard(activeCol);
  renderHUD();
  renderShooter(activeCol);
});

startGame();
</script>
</body>
</html>
