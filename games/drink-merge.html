<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Drink Merge</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden}
    body{
      background:linear-gradient(170deg,#0a0f1e,#0f2027,#1a3a4a);
      display:flex;align-items:center;justify-content:center;
      font-family:system-ui,sans-serif;
      user-select:none;-webkit-user-select:none;color:#e8eaf0;
    }
    #wrap{display:flex;flex-direction:column;align-items:center;gap:7px}
    #hud{display:flex;gap:8px}
    .hb{background:#0c1526;border-radius:12px;padding:10px 8px;text-align:center;border:1px solid #1e3a5f;flex:1;min-width:75px}
    .hl{color:#7a95b0;font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
    .hv{font-size:24px;font-weight:900;line-height:1.1}

    #cur-display{
      display:flex;align-items:center;justify-content:center;gap:14px;
      background:#0c1526;border:1.5px solid #1e3a5f;border-radius:14px;
      padding:9px 18px;
    }
    #cur-emoji{font-size:34px;line-height:1}
    #cur-label{color:#7a95b0;font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
    #cur-name{font-size:15px;font-weight:700;color:#e8eaf0}

    /* DANGER FLASH when new row incoming */
    #pressure-bar{height:6px;border-radius:99px;overflow:hidden;background:#1a2535}
    #pressure-fill{height:100%;border-radius:99px;transition:width 0.3s,background 0.3s;width:0%}

    #bwrap{position:relative}
    #board{
      display:grid;
      background:linear-gradient(180deg,#060d1a,#0d1b2a);
      border:1.5px solid #1a3050;border-radius:12px;overflow:hidden;
      box-shadow:0 4px 40px rgba(0,0,0,.6);cursor:pointer;
    }
    .cell{display:flex;align-items:center;justify-content:center;
      border-right:1px solid rgba(255,255,255,0.05);
      border-bottom:1px solid rgba(255,255,255,0.05);transition:background 0.1s}
    .cell.dt{border-top:1px solid rgba(239,68,68,0.4)}
    .cell.hot{background:rgba(232,160,32,0.13)}
    .cell.new-row{animation:flashrow 0.4s ease}
    @keyframes flashrow{0%{background:rgba(239,68,68,0.4)}100%{background:transparent}}

    #anim{position:absolute;pointer-events:none;z-index:20;display:none;
      align-items:center;justify-content:center}

    #arrows{display:flex;margin-bottom:-4px}
    .arr-cell{display:flex;align-items:flex-end;justify-content:center;
      height:14px;font-size:11px;color:#e8a020;opacity:0;transition:opacity 0.1s}
    .arr-cell.on{opacity:1}

    #prog-wrap{}
    #prog-label{display:flex;justify-content:space-between;color:#9aaabb;font-size:13px;font-weight:600;margin-bottom:4px}
    #prog-bg{height:4px;background:#0d1b2a;border-radius:99px;overflow:hidden}
    #prog-bar{height:100%;background:linear-gradient(90deg,#34d399,#059669);border-radius:99px;transition:width 0.3s;width:0%}
    #hint{color:#5a7080;font-size:11px;text-align:center;margin-top:5px}

    #combo{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);
      font-size:40px;font-weight:900;color:#fcd34d;text-shadow:0 0 30px #f59e0b;
      z-index:999;pointer-events:none;display:none}

    #gameover{position:absolute;inset:0;background:rgba(0,0,0,.93);
      display:none;flex-direction:column;align-items:center;justify-content:center;
      gap:10px;z-index:50;border-radius:12px}
    #rbtn{margin-top:8px;background:linear-gradient(135deg,#fcd34d,#f59e0b);
      color:#0a0f1e;border:none;border-radius:10px;padding:13px 44px;
      font-size:16px;font-weight:800;cursor:pointer}

    @keyframes pop{
      0%{transform:translate(-50%,-50%) scale(.3);opacity:0}
      65%{transform:translate(-50%,-50%) scale(1.2);opacity:1}
      100%{transform:translate(-50%,-50%) scale(1);opacity:1}
    }
    @keyframes shake{
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-6px)}
      40%{transform:translateX(6px)}
      60%{transform:translateX(-4px)}
      80%{transform:translateX(4px)}
    }
  </style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="hb"><div class="hl">Score</div><div class="hv" id="score" style="color:#fcd34d">0</div></div>
    <div class="hb"><div class="hl">Level</div><div class="hv" id="level" style="color:#34d399">1</div></div>
    <div class="hb"><div class="hl">Next</div><div class="hv" id="next-val" style="font-size:26px">🍊</div></div>
  </div>

  <div id="cur-display">
    <div id="cur-emoji">🧃</div>
    <div>
      <div id="cur-label">Current drink</div>
      <div id="cur-name">Juice Box</div>
    </div>
  </div>

  <!-- Pressure bar: fills up → new row pushes in from bottom -->
  <div id="pressure-bar" style="width:100%">
    <div id="pressure-fill"></div>
  </div>

  <div id="arrows"></div>

  <div id="bwrap">
    <div id="board"></div>
    <div id="anim"></div>
    <div id="combo"></div>
    <div id="gameover">
      <div style="font-size:52px">😵</div>
      <div style="color:#f87171;font-size:26px;font-weight:900">GAME OVER</div>
      <div id="go-lv" style="color:#64748b;font-size:14px"></div>
      <div id="go-sc" style="color:#fcd34d;font-size:32px;font-weight:800"></div>
      <button id="rbtn">Play Again</button>
    </div>
  </div>

  <div id="prog-wrap">
    <div id="prog-label"><span id="pl">Level 1</span><span id="pd">0 / 8 to next level</span></div>
    <div id="prog-bg"><div id="prog-bar"></div></div>
    <div id="hint">Tap column to drop · Match 3 · New row every 5 drops!</div>
  </div>
</div>

<script>
// 12 drink types
const DRINKS=[
  {e:"🧃",n:"Juice Box",   c:"#f59e0b"},
  {e:"🍊",n:"Orange",      c:"#f97316"},
  {e:"🍹",n:"Tropical",    c:"#10b981"},
  {e:"🫐",n:"Berry",       c:"#8b5cf6"},
  {e:"🍸",n:"Cocktail",    c:"#3b82f6"},
  {e:"🥂",n:"Champagne",   c:"#fcd34d"},
  {e:"🍷",n:"Wine",        c:"#dc2626"},
  {e:"🍺",n:"Beer",        c:"#ca8a04"},
  {e:"🧋",n:"Bubble Tea",  c:"#d97706"},
  {e:"🥤",n:"Soda",        c:"#0891b2"},
  {e:"🍵",n:"Green Tea",   c:"#16a34a"},
  {e:"☕",n:"Coffee",      c:"#92400e"},
];

const COLS=5;   // narrower — harder
const ROWS=10;
const DROPS_PER_LEVEL=8;    // faster level up
const NEW_ROW_EVERY=5;      // push new row from bottom every 5 drops
const INIT_ROWS=5;          // start with 5 rows filled

// How many types available per level (starts at 4, adds 1 every 2 levels, max 12)
function maxType(lv){ return Math.min(3+Math.floor(lv/2), 11); }

let board,cur,nxt,score,drops,level,over,busy,aCol;
let cs,BW,BH;
let pressureDrops=0; // counts toward next forced row

function calcSize(){
  const avW=Math.min(window.innerWidth-24,380);
  const avH=window.innerHeight - 82 - 8 - 62 - 8 - 8 - 8 - 14 - 8 - 65 - 20;
  cs=Math.max(Math.min(Math.floor(avW/COLS),Math.floor(avH/ROWS),58),28);
  BW=cs*COLS; BH=cs*ROWS;
}

function rnd(max){ return Math.floor(Math.random()*(max+1)); }
function mkB(){ return Array.from({length:ROWS},()=>Array(COLS).fill(-1)); }

function grav(b){
  for(let c=0;c<COLS;c++){
    const s=[];
    for(let r=0;r<ROWS;r++) if(b[r][c]>=0) s.push(b[r][c]);
    for(let r=0;r<ROWS;r++) b[r][c]=-1;
    s.forEach((v,i)=>{ b[ROWS-s.length+i][c]=v; });
  }
}

function mtch(b){
  const h=new Set();
  for(let r=0;r<ROWS;r++)
    for(let c=0;c<=COLS-3;c++){
      const a=b[r][c];
      if(a>=0&&a===b[r][c+1]&&a===b[r][c+2]){
        h.add(`${r},${c}`);h.add(`${r},${c+1}`);h.add(`${r},${c+2}`);
      }
    }
  for(let c=0;c<COLS;c++)
    for(let r=0;r<=ROWS-3;r++){
      const a=b[r][c];
      if(a>=0&&a===b[r+1][c]&&a===b[r+2][c]){
        h.add(`${r},${c}`);h.add(`${r+1},${c}`);h.add(`${r+2},${c}`);
      }
    }
  return h;
}

function resolve(b){
  let cl=0;
  while(true){
    const m=mtch(b);
    if(!m.size) break;
    cl+=m.size;
    m.forEach(k=>{ const[r,c]=k.split(',').map(Number); b[r][c]=-1; });
    grav(b);
  }
  return cl;
}

// Push a new row of drinks up from the bottom (everything shifts up 1)
function pushRow(){
  // shift all rows up by 1
  for(let r=0;r<ROWS-1;r++)
    for(let c=0;c<COLS;c++)
      board[r][c]=board[r+1][c];
  // fill bottom row with new random drinks (avoid instant 3-match)
  const mt=maxType(level);
  for(let c=0;c<COLS;c++){
    let t;
    do { t=rnd(mt); } while(
      (c>=2 && board[ROWS-1][c-1]===t && board[ROWS-1][c-2]===t)
    );
    board[ROWS-1][c]=t;
  }
  // flash bottom row
  for(let c=0;c<COLS;c++){
    const el=document.getElementById(`c${ROWS-1}_${c}`);
    if(el){ el.classList.remove('new-row'); void el.offsetWidth; el.classList.add('new-row'); }
  }
  // resolve any accidental matches from push
  resolve(board);
}

function initBoard(){
  const b=mkB();
  const mt=2; // start with 3 types for init
  for(let r=ROWS-INIT_ROWS;r<ROWS;r++)
    for(let c=0;c<COLS;c++)
      b[r][c]=rnd(mt);
  resolve(b);
  return b;
}

function init(){
  board=initBoard();
  cur=rnd(maxType(1));
  nxt=rnd(maxType(1));
  score=0; drops=0; level=1; over=false; busy=false; aCol=null;
  pressureDrops=0;
}

function buildUI(){
  calcSize();
  document.getElementById('wrap').style.width=BW+'px';
  document.getElementById('pressure-bar').style.width=BW+'px';

  const ar=document.getElementById('arrows');
  ar.innerHTML=''; ar.style.width=BW+'px';
  for(let c=0;c<COLS;c++){
    const d=document.createElement('div');
    d.className='arr-cell'; d.id='ar'+c; d.textContent='▼';
    d.style.width=cs+'px';
    ar.appendChild(d);
  }

  const bd=document.getElementById('board');
  bd.style.cssText=`width:${BW}px;height:${BH}px;grid-template-columns:repeat(${COLS},${cs}px);grid-template-rows:repeat(${ROWS},${cs}px)`;
  bd.innerHTML='';
  for(let r=0;r<ROWS;r++)
    for(let c=0;c<COLS;c++){
      const d=document.createElement('div');
      d.className='cell'+(r===1?' dt':'');
      d.style.fontSize=(cs*0.5)+'px';
      d.id=`c${r}_${c}`;
      bd.appendChild(d);
    }

  const bw=document.getElementById('bwrap');
  bw.style.width=BW+'px';
  document.querySelectorAll('.tz').forEach(e=>e.remove());
  for(let c=0;c<COLS;c++){
    const d=document.createElement('div');
    d.className='tz';
    d.style.cssText=`position:absolute;left:${c*cs}px;top:0;width:${cs}px;height:${BH}px;cursor:pointer;z-index:10`;
    d.addEventListener('pointerdown',e=>{ e.preventDefault(); setCol(c); drop(c); });
    d.addEventListener('pointerenter',()=>setCol(c));
    bw.appendChild(d);
  }

  const an=document.getElementById('anim');
  an.style.cssText=`width:${cs}px;height:${cs}px;font-size:${cs*0.5}px`;
  document.getElementById('prog-wrap').style.width=BW+'px';
  document.getElementById('cur-display').style.width=BW+'px';
}

function setCol(c){
  aCol=c;
  for(let i=0;i<COLS;i++){
    document.getElementById('ar'+i)?.classList.toggle('on',i===c);
    for(let r=0;r<ROWS;r++)
      document.getElementById(`c${r}_${i}`)?.classList.toggle('hot',i===c);
  }
}

function paintBoard(){
  for(let r=0;r<ROWS;r++)
    for(let c=0;c<COLS;c++){
      const el=document.getElementById(`c${r}_${c}`);
      if(el) el.textContent=board[r][c]>=0?DRINKS[board[r][c]].e:'';
    }
}

function paintCurrent(){
  const d=DRINKS[cur];
  document.getElementById('cur-emoji').textContent=d.e;
  document.getElementById('cur-name').textContent=d.n;
  document.getElementById('cur-display').style.borderColor=d.c+'88';
}

function paintHUD(){
  document.getElementById('score').textContent=score;
  document.getElementById('level').textContent=level;
  document.getElementById('next-val').textContent=DRINKS[nxt].e;
  document.getElementById('pl').textContent='Level '+level;
  document.getElementById('pd').textContent=(drops%DROPS_PER_LEVEL)+' / '+DROPS_PER_LEVEL+' to next level';
  document.getElementById('prog-bar').style.width=((drops%DROPS_PER_LEVEL)/DROPS_PER_LEVEL*100)+'%';

  // Pressure bar — shows how close next forced row is
  const pct=(pressureDrops/NEW_ROW_EVERY)*100;
  const fill=document.getElementById('pressure-fill');
  fill.style.width=pct+'%';
  // Color: green → yellow → red as it fills
  const r=pct>66?220:pct>33?200:50;
  const g=pct>66?50:pct>33?180:180;
  fill.style.background=`rgb(${r},${g},50)`;
}

function showCombo(msg){
  const el=document.getElementById('combo');
  el.textContent=msg; el.style.display='block';
  el.style.animation='none'; void el.offsetWidth;
  el.style.animation='pop .4s cubic-bezier(.36,2,.6,1) both';
  setTimeout(()=>{ el.style.display='none'; },1300);
}

function drop(col){
  if(over||busy) return;
  if(board[0][col]>=0) return;
  busy=true;

  const dt=cur;
  const an=document.getElementById('anim');
  an.textContent=DRINKS[dt].e;
  an.style.cssText=`width:${cs}px;height:${cs}px;font-size:${cs*0.5}px;position:absolute;left:${col*cs}px;top:0;opacity:1;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:20`;

  const dur=150, t0=performance.now();
  (function animate(now){
    const p=Math.min((now-t0)/dur,1), ease=p*p;
    an.style.top=(ease*BH)+'px';
    an.style.opacity=String(1-p*0.6);
    if(p<1){ requestAnimationFrame(animate); return; }

    an.style.display='none';

    let row=-1;
    for(let r=ROWS-1;r>=0;r--) if(board[r][col]<0){ row=r; break; }
    if(row<0){ busy=false; return; }

    board[row][col]=dt;
    const cl=resolve(board);

    drops++;
    pressureDrops++;
    level=Math.min(Math.floor(drops/DROPS_PER_LEVEL)+1,12);
    score+=cl*10*level;

    // Advance queue
    cur=nxt;
    nxt=rnd(maxType(level));

    // Push new row every NEW_ROW_EVERY drops
    if(pressureDrops>=NEW_ROW_EVERY){
      pressureDrops=0;
      pushRow();
      // shake the board
      const bd=document.getElementById('board');
      bd.style.animation='none'; void bd.offsetWidth;
      bd.style.animation='shake 0.3s ease';
    }

    over=board[0].some(v=>v>=0);

    if(cl>0) showCombo(cl>=12?"🔥 GODLIKE!":cl>=9?"💥 INSANE!":cl>=6?"✨ MEGA!":"👍 NICE!");

    paintBoard(); paintHUD(); paintCurrent();
    if(aCol!==null) setCol(aCol);
    busy=false;

    if(over){
      document.getElementById('go-lv').textContent='Level '+level+' · '+drops+' drops';
      document.getElementById('go-sc').textContent=score+' pts';
      document.getElementById('gameover').style.display='flex';
    }
  })(performance.now());
}

function start(){
  init(); buildUI(); paintBoard(); paintHUD(); paintCurrent();
  document.getElementById('gameover').style.display='none';
  aCol=null;
}

document.getElementById('rbtn').addEventListener('click',start);
window.addEventListener('resize',()=>{ buildUI(); paintBoard(); paintHUD(); paintCurrent(); if(aCol!==null) setCol(aCol); });
start();
</script>
</body>
</html>
